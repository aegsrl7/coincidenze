name = "coincidenze-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

routes = [
  { pattern = "api.coincidenze.org", custom_domain = true }
]

[vars]
RESEND_FROM = "COINCIDENZE <noreply@coincidenze.org>"
PUBLIC_BASE_URL = "https://coincidenze.org"

[[d1_databases]]
binding = "DB"
database_name = "coincidenze-db"
database_id = "36829bf3-c3e6-4c18-8df8-40dea1d2bc42"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "coincidenze-media"

# Cron: due trigger UTC, lo handler filtra per ora locale Europe/Rome
# 16 UTC = 18 Rome estate (CEST), 17 UTC = 18 Rome inverno (CET)
[triggers]
crons = ["0 16 * * *", "0 17 * * *"]
